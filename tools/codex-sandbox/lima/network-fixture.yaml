# Feasibility fixture only; not a production VM or launcher default.
# Guest image comes from Lima 1.2.1; bundle digest is the upstream release checksum.
minimumLimaVersion: 1.2.1
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 12GiB
images:
# Ubuntu's archive serves HTTP; the mandatory digest authenticates the bytes.
- location: http://cloud-images-archive.ubuntu.com/releases/noble/release-20250704/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:bbecbb88100ee65497927ed0da247ba15af576a8855004182cf3c87265e25d35
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
hostResolver:
  enabled: true
  ipv6: false
propagateProxyEnv: false
provision:
# Runs before containerd installation; the fixture preflight rejects a missing transport.
- mode: dependency
  file: install-slirp4netns.py
containerd:
  system: false
  user: true
  archives:
  - location: https://github.com/containerd/nerdctl/releases/download/v2.3.5/nerdctl-full-2.3.5-linux-arm64.tar.gz
    arch: aarch64
    digest: sha256:6e4b687f1d138e750a3c8372abc0f81d3d7490b6359c48c0562fc7dfe98859b2
