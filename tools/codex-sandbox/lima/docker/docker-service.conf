[Unit]
Requires=sandbox.slice
After=sandbox.slice

[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS=--cidr=10.0.2.0/24"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=true"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_DISABLE_HOST_LOOPBACK=true"
ExecStart=
ExecStart=/usr/bin/dockerd-rootless.sh --config-file=/usr/local/share/codex-sandbox/docker-daemon.json
ExecStartPost=/usr/bin/python3 /usr/local/share/codex-sandbox/docker-policy.py install
TimeoutStartSec=180
