[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-metabrowser-rst"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "docutils==0.23",
    "metabrowser==0.12.0",
]

[project.entry-points."metabrowser.plugins"]
dotfiles-rst = "dotfiles_metabrowser_rst:rst_plugin_dir"
dotfiles-markdown-mermaid = "dotfiles_metabrowser_rst:markdown_mermaid_plugin_dir"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/dotfiles_metabrowser_rst/**/*.py" },
    { file = "src/dotfiles_metabrowser_rst/plugin/**/*" },
    { file = "src/dotfiles_metabrowser_rst/markdown_mermaid_plugin/**/*" },
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dotfiles_metabrowser_rst = [
    "plugin/*",
    "markdown_mermaid_plugin/*",
    "markdown_mermaid_plugin/vendor/*",
]
