[package]
name = "tic-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
nix = { version = "0.29", features = ["poll", "fs", "signal", "process", "user", "socket"] }
sha2 = "0.10"
ticgit = "=0.3.1"
# Configuration-free low-level preflight; already native transitive dependencies.
gix-discover = "=0.49.0"
gix-config = "=0.54.0"
gix-pack = { version = "=0.68.0", default-features = false, features = ["sha1"] }

[[bin]]
name = "ti-proxy"
path = "src/bin/ti.rs"

[[bin]]
name = "tic-broker"
path = "src/bin/tic-broker.rs"
