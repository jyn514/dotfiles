[metadata]
name = plover-reconnect
version = 0.1.0
description = Reconnect Plover when a selected USB machine is attached
author = jyn and Codex
url = https://github.com/jyn514/dotfiles
keywords = plover plover_plugin
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0 OR BSD-3-Clause

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    usbx>=0.8.3,<0.9

[options.extras_require]
test =
    plover>=5.4,<6

[options.entry_points]
plover.extension =
    plover-reconnect = plover_reconnect.extension:Extension
plover.gui.qt.tool =
    plover-reconnect = plover_reconnect.tool:DeviceTool

[options.package_data]
plover_reconnect =
    resources/*.svg
