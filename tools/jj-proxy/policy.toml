[global]
forbidden_options = [
  "--repository", "-R", "--workspace", "--config", "--config-file",
  "--config-toml", "--operation", "--at-operation", "--at-op",
  "--ignore-working-copy", "--tool", "--editor",
  "--pager", "--sign", "--signing-key", "--ssh-command",
]
forbidden_prefixes = ["--config-", "--repository-"]

[inspect]
status = true
diff = true
log = true
show = true
interdiff = true
evolog = true
root = true
version = true
help = true
file = { subcmds = ["annotate", "list", "search", "show"] }
workspace = { subcmds = ["list", "root"] }
op = { subcmds = ["log", "show", "diff"] }
bookmark = { subcmds = ["list"] }
tag = { subcmds = ["list"] }
sparse = { subcmds = ["list"] }
git = { subcmds = ["root"] }
config = { subcmds = ["get", "list", "path"] }

# Mutation mode also permits every inspection rule.
[mutate]
commit = { updates_author = true }
describe = true
new = true
split = { updates_author = true }
squash = true
rebase = true
restore = true
abandon = true
duplicate = true
edit = true
next = true
prev = true
undo = true
file = true
workspace = true
bookmark = { subcmds = [
  "create", "delete", "forget", "list", "move",
  "rename", "set", "track", "untrack",
] }
git = { subcmds = ["fetch"] }
