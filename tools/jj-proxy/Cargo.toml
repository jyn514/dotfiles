[package]
name = "jj-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = { version = "0.6", default-features = false }
nix = { version = "0.29", features = ["fs", "process", "resource", "signal", "socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"

[profile.release]
debug = 1
strip = false
# The proxy mostly validates requests and waits for jj. Prefer Cargo's parallel
# code generation over whole-program optimization, including in image tests.
lto = false
codegen-units = 16
panic = "abort"
