[Service]
# These optional backends are absent on hosts using the standard shadow database.
# Keep warnings for permission errors and other unexpected backend failures.
LogFilterPatterns="~^Unable to open /etc/tcb: No such file or directory$"
LogFilterPatterns="~^couldn't list homed users: GDBus[.]Error:org[.]freedesktop[.]DBus[.]Error[.]NameHasNoOwner: Could not activate remote peer 'org[.]freedesktop[.]home1': activation request failed: unknown unit$"
