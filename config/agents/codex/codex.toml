approvals_reviewer = "auto_review"
service_tier = "default"
model = "gpt-daybreak-blue-latest"
model_reasoning_effort = "low"
default_permissions = "default_permission_rules"
daybreak = true

[permissions.default_permission_rules]
extends = ":workspace"

[permissions.default_permission_rules.filesystem]
"/private/tmp" = "write"

[permissions.default_permission_rules.network]
enabled = true
mode = "limited"

[permissions.default_permission_rules.network.domains]
"api.github.com" = "allow"
"api.rubygems.org" = "allow"
"archive.ubuntu.com" = "allow"
"auth.docker.io" = "allow"
"codeload.github.com" = "allow"
"crates.io" = "allow"
"deb.debian.org" = "allow"
"developer.mozilla.org" = "allow"
"doc.rust-lang.org" = "allow"
"docs.python.org" = "allow"
"docs.rs" = "allow"
"files.pythonhosted.org" = "allow"
"github.com" = "allow"
"index.crates.io" = "allow"
"nodejs.org" = "allow"
"objects.githubusercontent.com" = "allow"
"packagist.org" = "allow"
"pkg.go.dev" = "allow"
"plugins.gradle.org" = "allow"
"production.cloudflare.docker.com" = "allow"
"proxy.golang.org" = "allow"
"pypi.org" = "allow"
"raw.githubusercontent.com" = "allow"
"registry-1.docker.io" = "allow"
"registry.npmjs.org" = "allow"
"release-assets.githubusercontent.com" = "allow"
"repo.packagist.org" = "allow"
"repo1.maven.org" = "allow"
"rubygems.org" = "allow"
"security.debian.org" = "allow"
"services.gradle.org" = "allow"
"static.crates.io" = "allow"
"sum.golang.org" = "allow"

[shell_environment_policy]
exclude = ["CODEX_ACCESS_TOKEN"]

[features]
network_proxy = true

[features.multi_agent_v2]
# breaks /agent and max_threads
enabled = false
# unfortunately Sol forces it on, so configure it anyway
max_concurrent_threads_per_session = 13

[agents]
max_threads = 13
max_depth = 2

[tui]
auto_recap = false
show_tooltips = false
whimsy = false
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "thread-name"]
status_line_use_colors = true
session_picker_view = "comfortable"
resume_cwd = "current"
terminal_title = ["run-state", "context-used", "model", "thread-name"]
screen_reader_detection_done = true

[tui.keymap.composer]
queue = ["tab", "alt-enter"]

[tui.keymap.global]
copy = "ctrl-x"
open_transcript = ["ctrl-t", "ctrl-o"]

[mcp_servers.cclsp]
enabled = false
command = "npx"
args = ["cclsp"]

[mcp_servers.cclsp.env]
CCLSP_CONFIG_PATH = ".agents/cclsp.json"

[mcp_servers.cclsp.tools.find_definition]
approval_mode = "approve"

[mcp_servers.cclsp.tools.find_references]
approval_mode = "approve"

[mcp_servers.cclsp.tools.get_diagnostics]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true

[realtime]
voice = "cove"
