# this is slower than just fs stats on small repos :/
# only turn it on for giant worktrees
#fsmonitor.backend = "watchman"
fsmonitor.watchman.register-snapshot-trigger = true

[ui]
default-command = "log"
# diff.tool=["difft", "--color=always", "$left", "$right"]
diff-formatter=["delta", "$left", "$right"]
diff-editor = ":builtin"
merge-editor = "meld"

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
    "-c", "let g:jj_diffconflicts_marker_length=$marker_length",
    "-c", "JJDiffConflicts!", "$output", "$base", "$left", "$right",
]

merge-tool-edits-conflict-markers = true
[revsets]
bookmark-advance-to = '@-'
# i use a bunch of emails; easier to just track author name
log = '@ | trunk()..author(substring:"jyn") ~ (trunk()..untracked_remote_bookmarks() ~ untracked_remote_bookmarks()) | trunk()'

[revset-aliases]
'trunk' = 'trunk()'
'0' = 'trunk()'
'working' = 'heads(@- | tags() | bookmarks() | remote_bookmarks()) & author(substring-i:"jyn")'
'with_conflicts(end)' = '(conflicts() | conflicts()+) & ::end'
'with_conflicts' = 'with_conflicts(@)'

[user]
name = "jyn"
email = "github@jyn.dev"

[aliases]
# abbreviations
h = ["help"]
c = ["commit"]
n = ["new"]
e = ["edit"]
l = ["log"]
d = ["diff"]
s = ["status"]
r = ["rebase"]
sh = ["show"]
p = ["push"]
f = ["fetch"]
g = ["git"]
pub = ["publish"]

# aliases
amend = ["squash"]
branch = ["bookmark"]
worktree = ["workspace"]
remote = ["git", "remote"]
push = ["git", "push"]
fetch = ["git", "fetch"]
tug = ["bookmark", "advance"]
init = ["git", "init"]

# new commands
publish = ["util", "exec", "bash", "--", "-c", "git hook run pre-push --ignore-missing && jj tug && jj push"]
new-branch = ["bookmark", "create", "-r=@-"]
branch-log = ["log", "--revisions", "trunk()..@"]
recent = ["log", "--no-graph", "--reversed", "--revisions", "working", "--template", "recent"]
conflicts = ["log", "--no-graph", "-T", "show_conflicts", "-r", "with_conflicts"]

[templates]
git_push_bookmark = '"jyn/" ++ description.split(regex:"\s").first()'
workspace_list = 'name ++ " " ++ root++"\n"'
[template-aliases]
'recent' = 'committer.timestamp().ago() ++ ": " ++ bookmarks ++ " | " ++ description.first_line() ++ "\n"'
'format_short_signature(signature)' = 'label("username", signature.name())'
'format_timestamp(timestamp)' = 'timestamp.ago()'
show_conflicts = '''
if(self.diff().files().any(|f| f.source().conflict() || f.target().conflict()),
   change_id.short() ++ " " ++ commit_id.short() ++ " " ++ description.first_line() ++ "\n"
   ++ self.diff().files().filter(|f| f.source().conflict() || f.target().conflict())
          .map(|f| "  " ++ f.source().file_type() ++ " -> " ++ f.target().file_type()
                        ++ " " ++ f.display_diff_path())
          .join("\n") ++ "\n")
'''

# `jj config list --include-defaults template-aliases.builtin_log_compact`
# the only difference here is turning the newline into a space lol
"builtin_log_compact(commit)" = '''
if(commit.root(),
  format_root_commit(commit),
  label(
    separate(" ",
      if(commit.current_working_copy(), "working_copy"),
      if(commit.immutable(), "immutable", "mutable"),
      if(commit.conflict(), "conflicted"),
    ),
    concat(
      format_short_commit_header(commit) ++ " ",
      separate(" ",
        if(commit.empty(), empty_commit_marker),
        if(commit.description(),
          commit.description().first_line(),
          label(if(commit.empty(), "empty"), description_placeholder),
        ),
      ) ++ "\n",
    ),
  )
)
'''

# move git_head and bookmarks earlier
"format_short_commit_header(commit)" = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  if(commit.contained_in('first_parent(@)'), label("git_head", "HEAD")),
  commit.bookmarks(),
  commit.tags(),
  format_short_signature(commit.author()),
  format_timestamp(commit_timestamp(commit)),
  commit.working_copies(),
  format_short_commit_id(commit.commit_id()),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''
