[tools]
node = "lts"
rust = { version = "nightly", profile = "minimal", components = ["rustfmt", "clippy", "rust-analyzer", "miri"] }
uv = "latest"
"asdf:mise-plugins/mise-clojure" = "latest"
"aqua:getzola/zola" = "0.21.0"
"aqua:cargo-bins/cargo-binstall" = "latest"
"github:clojure-lsp/clojure-lsp" = { version = "latest", filter_bins = "clojure-lsp" }
"aqua:antonmedv/fx" = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
# Unix uses native packages; keep mise as the Windows provider.
"aqua:mvdan/sh" = { version = "latest", filter_bins = "shfmt", os = ["windows"] }
"cargo:broot" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"] }
"github:rustsec/rustsec" = { version = "latest", version_prefix = "cargo-audit/v", matching = "cargo-audit-", filter_bins = "cargo-audit" }
"cargo:cargo-outdated" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"] }
"cargo:cargo-sweep" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"] }
"cargo:counts" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"] }
"cargo:librespot" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"], os = ["linux/x64", "macos/x64", "windows/x64"] }
"cargo:mdbook" = { version = "latest", depends = ["rust", "aqua:cargo-bins/cargo-binstall"] }
"aqua:Wilfred/difftastic" = "latest"
"aqua:Byron/dua-cli" = "latest"
"aqua:lima-vm/lima" = "latest"
"aqua:jj-vcs/jj" = "latest"
"aqua:BurntSushi/ripgrep" = { version = "latest", os = ["windows"] }
"aqua:Myriad-Dreamin/tinymist" = "latest"
"github:glide-browser/glide" = { version = "latest", os = ["linux"], filter_bins = "glide" }
"aqua:pnpm/pnpm" = "latest"
"npm:perlnavigator-server" = { version = "latest", depends = ["node", "aqua:pnpm/pnpm"] }
"npm:bash-language-server" = { version = "latest", depends = ["node", "aqua:pnpm/pnpm"] }
"npm:typescript-language-server" = { version = "latest", depends = ["node", "aqua:pnpm/pnpm"] }
"npm:oxlint" = { version = "latest", depends = ["node", "aqua:pnpm/pnpm"] }
"npm:vscode-langservers-extracted" = { version = "latest", depends = ["node", "aqua:pnpm/pnpm"] }
"pipx:git-revise" = { version = "latest", depends = ["uv"] }
"pipx:pylint" = { version = "latest", depends = ["uv"] }
"pipx:yt-dlp" = { version = "latest", depends = ["uv"] }

[vars]
# Task tool requests do not honor floating-version locks; keep the bootstrap pin explicit.
bootstrap_python = "3.14.7"

[tasks.bootstrap-python]
description = "Run Python for dotfiles bootstrapping, without changing shell Python"
dir = "{{cwd}}"
tools.python = "{{vars.bootstrap_python}}"
run = "python"

[tasks.pi-install]
description = "Build and install jyn514/pi from upstream main"
dir = "{{cwd}}"
tools.python = "{{vars.bootstrap_python}}"
run = "python libexec/setup/install_pi.py"

[settings]
task.run_auto_install = false
# Prefer available binaries on every host, including Alpine and NixOS.
all_compile = false
lockfile = true
locked = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
npm.package_manager = "pnpm"
cargo.binstall = true
cargo.binstall_only = true

[settings.github]
oauth_client_id = "Iv23li0gR6P4iv8HXrsF"
oauth_export_env = "GITHUB_TOKEN"
use_git_credentials = true
