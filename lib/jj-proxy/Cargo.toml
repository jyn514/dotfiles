[package]
name = "jj-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = { version = "0.6", default-features = false }
nix = { version = "0.29", features = ["fs", "process", "resource", "signal", "socket"] }
landlock = "0.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
strip = false
lto = true
codegen-units = 1
panic = "abort"
